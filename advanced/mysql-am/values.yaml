mysql:
  image: "bitnami/mysql"
  imageTag: "5.7.41"
  mysqlRootPassword: root
  mysqlUser: wso2carbon
  mysqlPassword: wso2carbon
  fullnameOverride: "wso2am-mysql-db-service"
  # Note: the pinned WSO2 mysql subchart (v1.6.9) does not expose startupProbe.
  # Compensate by giving the liveness probe enough initial delay for MySQL startup.
  livenessProbe:
    initialDelaySeconds: 30
  readinessProbe:
    initialDelaySeconds: 30
  configurationFiles:
    mysql.cnf: |-
      [mysqld]
      max_connections = 10000
